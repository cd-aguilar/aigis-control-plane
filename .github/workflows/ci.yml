# Minimal CI: the same two deterministic gates every commit already has to
# pass locally (CONTRIBUTING.md / `make check`). No secrets, no LLM calls,
# no `ruff format --check` (known formatting debt, see STATUS.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # P0 D5: build the sandbox image (base pinned by digest) and record its
      # image ID in sandbox/.image-id, which DockerSandbox verifies before
      # every run.
      - name: Build sandbox image
        run: make sandbox-image

      # AIGIS_REQUIRE_DOCKER=1: the docker tests that skip locally without a
      # daemon or image FAIL here instead. Closing criterion 1 needs them to
      # run for real (local and docker).
      - name: Test
        env:
          AIGIS_REQUIRE_DOCKER: "1"
        run: pytest -q -rs
