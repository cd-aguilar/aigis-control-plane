# Minimal CI: the same two deterministic gates every commit already has to
# pass locally (CONTRIBUTING.md / `make check`). No secrets, no LLM calls,
# no `ruff format --check` (known formatting debt, see STATUS.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Pre-pull the DockerSandbox base image so the first container test does
      # not spend its own 30 s timeout downloading it.
      - name: Pull sandbox image
        run: docker pull python:3.11-slim

      - name: Test
        run: pytest -q
