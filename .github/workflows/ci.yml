# Minimal CI: the same two deterministic gates every commit already has to
# pass locally (CONTRIBUTING.md / `make check`). No secrets, no LLM calls,
# no `ruff format --check` (known formatting debt, see STATUS.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions pinned by commit SHA (tag in the comment), verified against the
# official releases with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
# Both majors run on Node 24. Runner pinned to an exact image, not -latest.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # P0 D5: build the sandbox image (base pinned by digest) and record its
      # image ID in sandbox/.image-id, which DockerSandbox verifies before
      # every run.
      - name: Build sandbox image
        run: make sandbox-image

      # AIGIS_REQUIRE_DOCKER=1: the docker tests that skip locally without a
      # daemon or image FAIL here instead. Closing criterion 1 needs them to
      # run for real (local and docker).
      - name: Test
        env:
          AIGIS_REQUIRE_DOCKER: "1"
        run: pytest -q -rs
