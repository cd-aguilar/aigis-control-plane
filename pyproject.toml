[project]
name = "aigis-control-plane"
version = "0.1.0"
description = "Evidence-driven security and verification control plane for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dario Aguilar" }]
dependencies = [
    "pydantic>=2,<3",
    "anthropic>=0.40,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
]

[project.scripts]
aigis = "aigis.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aigis.policy" = ["policy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
